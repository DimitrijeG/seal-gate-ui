# seal-gate as the e2e tests run it: in memory, so every instance starts
# uninitialized. seal-gate.ts replaces the port with a free one for each
# spec file. seal-gate requires every field, even ones memory storage does
# not use.
logger:
  level: warn
  format: text
storage:
  type: memory
  path: unused
crypto:
  aead_algorithm: aes-256-gcm
http:
  address: 127.0.0.1:0
  read_header_timeout: 2s
  read_timeout: 5s
  write_timeout: 5s
  graceful_shutdown: 1s
audit:
  sinks:
    - type: file
      path: audit.log
      required: true
      timeout: 1s
      # A throwaway log; an fsync per record would only slow the run.
      sync: false
lifecycle:
  interval: 1m
token:
  default_ttl: 1h
  max_ttl: 24h
